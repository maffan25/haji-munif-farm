    <div id="mf-h" ${t.type === 'hadist' ? '' : 'hidden'}>${id ? '' : '<label class="field">Daftar hadist (satu per baris)<textarea id="mf-l" rows="6" placeholder="Hadist niat&#10;Hadist Islam, Iman, Ihsan"></textarea></label>'}</div>
    <div class="err" id="err" hidden></div><div class="mact"><button type="button" class="btn ghost" data-act="close">Batal</button><button class="btn">Simpan</button></div></form>`);
  $('#mf-t').oninput = () => { if (mfType !== 'quran') return; const s = SURAH.find(x => normS(x[0]) === normS($('#mf-t').value)); if (s && !$('#mf-e').dataset.u) $('#mf-e').value = s[1]; };
  $('#mf-e').oninput = () => { $('#mf-e').dataset.u = 1; };
  $('#mf').onsubmit = e => {
    e.preventDefault(); const er = $('#err'), bad = m => { er.hidden = false; er.textContent = m; }, title = $('#mf-t').value.trim(); if (!title) return bad('Isi judul target.');
    const base = {title, deadline:$('#mf-d').value};
    if (mfType === 'quran') { const f = +$('#mf-f').value || 1, to = +$('#mf-e').value; if (!to || to < f) return bad('Isi ayat target dengan benar.'); Object.assign(base, {from:f, to}); }
    if (id) Object.assign(t, base);
    else S.mut.push({id:uid(), type:mfType, from:1, to:0, ...base, items:mfType === 'quran' ? parseRanges($('#mf-r').value) : parseLines($('#mf-l').value)});
    save(); closeModal(); render({keep:true});
  };
}
document.addEventListener('submit', e => {
  const f = e.target.closest('.mb-add'); if (!f) return; e.preventDefault();
  const t = S.mut.find(x => x.id === f.dataset.t), inp = f.querySelector('input'), add = t.type === 'quran' ? parseRanges(inp.value) : parseLines(inp.value);
  if (!add.length) return toast(t.type === 'quran' ? 'Tulis rentang ayat, mis. 1-20' : 'Tulis hadistnya dulu');
  t.items.push(...add); if (t.type === 'quran') t.items.sort((a, b) => a.from - b.from); save(); render({keep:true});
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act^="mb-"]'); if (!el) return; const d = el.dataset, t = S.mut.find(x => x.id === d.t), it = t?.items.find(x => x.id === d.i);
  switch (d.act) {
    case 'mb-new': mbNew(); break;
    case 'mb-edit': mbNew(d.t); break;
    case 'mb-type': mfType = d.v; $('#mf-q').hidden = mfType !== 'quran'; $('#mf-h').hidden = mfType !== 'hadist'; document.querySelectorAll('.seg .chip-b').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === mfType)); break;
    case 'mb-pick': mbSel[d.t] = mbSel[d.t] === d.i ? null : d.i; render({keep:true}); break;
    case 'mb-toggle': it.done = !it.done; mbSel[d.t] = d.i; save(); if (it.done) { const r = el.getBoundingClientRect(); burst(r.left + 13, r.top + 13); } render({keep:true}); break;
    case 'mb-delitem': t.items = t.items.filter(x => x.id !== d.i); mbSel[d.t] = null; save(); render({keep:true}); break;
    case 'mb-del': if (confirm(`Hapus target "${t.title}"?`)) { S.mut = S.mut.filter(x => x.id !== d.t); save(); render({keep:true}); toast('Target dihapus'); } break;
  }
});

/* ---------- Skala nilai ---------- */
const SCALE0 = [['A+', 91, 100, 4], ['A', 86, 90, 4], ['A-', 81, 85, 3.7], ['B+', 76, 80, 3.3], ['B', 71, 75, 3], ['B-', 66, 70, 2.7], ['B', 61, 65, 2.5], ['C+', 56, 60, 2.3], ['C', 51, 55, 2], ['C-', 46, 50, 1.7], ['E', 0, 45, 0]].map(([l, min, max, p]) => ({l, min, max, p}));
const scale = () => S.scale && S.scale.length ? S.scale : SCALE0;
const LEG = {AB:'A-', BC:'B-', D:'C-'};
function bandOf(c) {
  const sc = scale(), v = scoreOf(c);
  if (v != null) { const r = Math.round(v); return sc.find(b => r >= b.min && r <= b.max) || sc.reduce((a, b) => (r > a.max ? (b.max > a.max ? b : a) : (b.min < a.min ? b : a)), sc[0]); }
  const g = LEG[c.grade] || c.grade; return sc.find(b => b.l === g) || null;
}
const graded = c => !!bandOf(c);
function scaleCard() {
  return `<article class="card glass rise" style="${ix()}"><div class="ch"><h3>Skala nilai</h3><button class="chip-b" data-act="scale-edit">Ubah skala</button></div><div class="scl">${scale().map(b => `<div><b>${esc(b.l)}</b>${b.min}–${b.max}<small>${(+b.p).toFixed(2)}</small></div>`).join('')}</div></article>`;
}
function scaleEdit() {
  openModal(`<h3>Skala nilai</h3><form id="sf"><label class="field">Satu baris per huruf: huruf, rentang angka, bobot<textarea id="sf-t" class="qsrc" rows="11">${scale().map(b => `${b.l} ${b.min}-${b.max} ${b.p}`).join('\n')}</textarea></label><small class="qfmt">Contoh: A+ 91-100 4.0. Bobot dipakai untuk menghitung IPS dan IPK. Dua baris boleh memakai huruf yang sama.</small><div class="err" id="err" hidden></div><div class="mact"><button type="button" class="btn ghost spacer" data-act="scale-reset">Kembalikan standar</button><button type="button" class="btn ghost" data-act="close">Batal</button><button class="btn">Simpan</button></div></form>`);
  $('#modal').style.width = 'min(520px,100%)';
  $('#sf').onsubmit = e => {
    e.preventDefault(); const sc = $('#sf-t').value.split('\n').map(l => l.trim().match(/^(\S+)\s+(\d+)\s*[-–]\s*(\d+)\s+(\d+(?:[.,]\d+)?)/)).filter(Boolean).map(m => ({l:m[1], min:+m[2], max:+m[3], p:parseFloat(m[4].replace(',', '.'))})).filter(b => b.max >= b.min);
    if (sc.length < 2) { const er = $('#err'); er.hidden = false; er.textContent = 'Tulis minimal 2 baris dengan format: A+ 91-100 4.0'; return; }
    S.scale = sc; save(); closeModal(); render({keep:true}); toast('Skala nilai disimpan');
  };
}
document.addEventListener('change', e => { const s = e.target.closest('[data-score]'); if (!s) return; const c = S.courses.find(x => x.id === s.dataset.score); c.score = s.value.trim(); save(); render({keep:true}); });

/* ---------- Sinkronisasi antar perangkat ---------- */
var SY = {ref:null, assets:null, busy:false, again:false, timer:0, lastTs:0, st:'off', pending:null, choose:null};
const SYT = {off:'Lokal', wait:'Menunggu', busy:'Sinkron…', ok:'Tersinkron', err:'Gagal', big:'Terlalu besar'};
function setSt(st) { SY.st = st; const b = $('#sync'); if (!b) return; b.dataset.st = st; b.querySelector('.sy-t').textContent = SYT[st]; }
function shape() {
  ['pdfs', 'quizzes', 'todos', 'mut'].forEach(k => { if (!S[k]) S[k] = []; });
  S.courses.forEach(c => { if (!c.sem) c.sem = 1; });
  if (!S.curSem) S.curSem = Math.max(1, ...S.courses.map(c => +c.sem));
  S.quizzes.forEach(z => { if (!z.qs) z.qs = parseQ(z.src || ''); });
}
const NOSYNC = ['theme', 'sessions', '_ts', '_synced'];
function slim() { const o = {}; Object.keys(S).forEach(k => { if (!NOSYNC.includes(k)) o[k] = S[k]; }); o.quizzes = (S.quizzes || []).map(({qs, ...z}) => z); return o; }
const typing = () => /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') || !$('#overlay').hidden || (view === 'room' && rdId);
function syncSoon() { if (!SY || !SY.ref) return; clearTimeout(SY.timer); setSt('wait'); SY.timer = setTimeout(push, 1500); }
async function push() {
  if (SY.busy) { SY.again = true; return; } SY.busy = true; setSt('busy');
  try {
    const ts = S._ts || Date.now(), json = JSON.stringify(slim()); if (json.length > 245000) throw {big:1};
    await SY.ref.set({ts, json}); SY.lastTs = ts; S._synced = 1; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} setSt('ok');
  } catch (e) { setSt(e && e.big ? 'big' : 'err'); }
  SY.busy = false; if (SY.again) { SY.again = false; syncSoon(); }
}
function applyRemote(r) {
  const keep = {theme:S.theme, sessions:S.sessions}, d = JSON.parse(r.json);
  Object.keys(S).forEach(k => delete S[k]); Object.assign(S, d, keep, {_ts:r.ts, _synced:1}); shape();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} SY.lastTs = r.ts; chrome(); render({keep:true});
}
function mergeRemote(r) {
  const d = JSON.parse(r.json), key = x => JSON.stringify({...x, id:0, qs:0}), objs = a => a.every(x => x && typeof x === 'object');
  Object.keys(d).forEach(k => {
    if (Array.isArray(d[k]) && Array.isArray(S[k]) && objs(d[k]) && objs(S[k])) {
      const m = new Map(S[k].map(x => [x.id, x])), seen = new Set(S[k].map(key));
      d[k].forEach(x => { if (m.has(x.id) || !seen.has(key(x))) m.set(x.id, x); }); S[k] = [...m.values()];
    } else S[k] = d[k];
  });
  shape(); S._ts = Date.now();
}
function chooseSync(r, done) {
  openModal(`<h3>Sinkronkan data</h3><p class="qfmt">Perangkat ini dan cloud sudah punya data yang berbeda. "Gabungkan" menyatukan keduanya tanpa menghapus apa pun.</p><div class="mact" style="flex-direction:column;align-items:stretch"><button class="btn" data-act="sy-merge">Gabungkan (disarankan)</button><button class="btn ghost" data-act="sy-cloud">Pakai data cloud, timpa perangkat ini</button><button class="btn ghost" data-act="sy-local">Pakai data perangkat ini, timpa cloud</button></div>`);
  SY.choose = async m => {
    closeModal();
    if (m === 'cloud') applyRemote(r);
    else { if (m === 'merge') mergeRemote(r); else S._ts = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} chrome(); render({keep:true}); await push(); }
    done();
  };
}
function onRemote(r) {
  if (!r || r.ts === SY.lastTs || r.ts <= (S._ts || 0)) return;
  if (typing()) { SY.pending = r; return; }
  applyRemote(r); toast('Data diperbarui dari perangkat lain');
}
setInterval(() => { const r = SY.pending; if (r && !typing()) { SY.pending = null; if (r.ts > (S._ts || 0)) { applyRemote(r); toast('Data diperbarui dari perangkat lain'); } } }, 3000);
async function syncInit() {
  if (!window.claude) return;
  try {
    const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]);
    SY.assets = assets; const id = user ? await user.id() : null; if (!db || !id) return setSt('off');
    SY.ref = db.doc(`data/users/${id}/state`); setSt('busy');
    const snap = await SY.ref.get();
    if (!snap.exists) { S._ts = S._ts || Date.now(); await push(); }
    else {
      const r = snap.data();
      if (!HAD) applyRemote(r);
      else if (S._synced) { if (r.ts > (S._ts || 0)) applyRemote(r); else if ((S._ts || 0) > r.ts) await push(); }
      else await new Promise(res => chooseSync(r, res));
    }
    SY.ref.onSnapshot(s => { if (s.exists) onRemote(s.data()); });
    if (SY.st !== 'err' && SY.st !== 'big') setSt('ok'); pdfUpAll();
  } catch { setSt('off'); }
}
async function pdfUp(f) {
  if (!SY.assets || f.aid || f.size > 20 * 1048576) return;
  try { const rec = await idb.get(f.id); if (!rec) return; const a = await SY.assets.upload(new Blob([rec.blob], {type:'application/pdf'})); f.aid = a.id; save(); } catch {}
}
async function pdfUpAll() { for (const f of S.pdfs.slice()) await pdfUp(f); }
async function pdfBlob(id) {
  let rec = await idb.get(id); if (rec) return rec;
  const f = S.pdfs.find(x => x.id === id); if (!f || !f.aid) return null;
  const r = await fetch('/_blob/' + f.aid); if (!r.ok) return null;
  rec = {id, blob:await r.blob()}; try { await idb.put(rec); } catch {} return rec;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const d = el.dataset.act;
  if (d === 'scale-edit') scaleEdit();
  else if (d === 'scale-reset') { delete S.scale; save(); closeModal(); render({keep:true}); toast('Skala standar dipulihkan'); }
  else if (d === 'sy-merge' || d === 'sy-cloud' || d === 'sy-local') SY.choose?.(d.slice(3));
  else if (d === 'sy-now') { closeModal(); (async () => { if (!SY.ref) return; setSt('busy'); const s = await SY.ref.get(); const r = s.exists ? s.data() : null; if (r && r.ts > (S._ts || 0)) applyRemote(r); else { S._ts = Date.now(); await push(); } pdfUpAll(); toast('Sinkron selesai'); })(); }
  else if (d === 'sync-info') {
    const n = S.pdfs.filter(f => f.aid).length, msg = {ok:'Datamu tersimpan di akun claude.ai-mu dan otomatis muncul di HP, tablet, atau PC lain yang membuka halaman ini dengan akun yang sama.', off:'Sinkronisasi belum aktif. Buka halaman ini lewat claude.ai dengan akun yang sama di semua perangkat. Sementara itu data tersimpan lokal di perangkat ini.', err:'Gagal menyimpan ke cloud. Akan dicoba lagi saat ada perubahan berikutnya.', big:'Datamu melebihi batas sinkron. Hapus catatan atau soal yang tidak perlu.', busy:'Sedang menyinkronkan…', wait:'Perubahan akan segera dikirim.'}[SY.st];
    openModal(`<h3>Sinkronisasi</h3><p class="qfmt">${msg}</p>${SY.ref ? `<p class="qfmt">PDF di cloud: ${n} dari ${S.pdfs.length} (maksimal 20 MB per file). PDF dibuka dari cloud saat pertama dibaca di perangkat baru.</p>` : ''}<div class="mact"><button type="button" class="btn ghost" data-act="close">Tutup</button>${SY.ref ? '<button type="button" class="btn" data-act="sy-now">Sinkronkan sekarang</button>' : ''}</div>`);
  }
});
shape(); syncInit();

/* ---------- Mulai ---------- */
buildChrome();
render({anim:true});
setInterval(() => { chrome(); if (view === 'home') refreshNext(); }, 60000);
})();
</script>
</body>
</html>
